name: CI Build & Verify

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Verify Codebase & Compile
    runs-on: ubuntu-latest

    steps:
      - name: 🔍 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 💅 Run Code Lint Check
        run: npm run lint

      - name: 🛡️ Run TypeScript Compilation Test
        run: npx tsc --noEmit

      - name: 🚀 Verify Expo Bundle Compilation (Export)
        run: npx expo export --platform all
